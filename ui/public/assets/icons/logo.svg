<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- 背景圆形 -->
  <circle cx="100" cy="100" r="95" fill="#3b82f6"/>
  <!-- 设备图标 - 矩形和圆形组合 -->
  <rect x="40" y="60" width="120" height="80" fill="#1d4ed8" rx="15"/>
  <!-- 顶部天线 -->
  <rect x="95" y="35" width="10" height="25" fill="#1d4ed8" rx="5"/>
  <circle cx="100" cy="30" r="10" fill="#1d4ed8"/>
  <!-- 屏幕内容 - 网格状指示灯 -->
  <rect x="50" y="70" width="100" height="60" fill="#3b82f6" rx="8"/>
  <!-- 指示灯网格 -->
  <g fill="white">
    <rect x="60" y="80" width="15" height="15" rx="3"/>
    <rect x="80" y="80" width="15" height="15" rx="3" opacity="0.7"/>
    <rect x="100" y="80" width="15" height="15" rx="3" opacity="0.5"/>
    <rect x="60" y="100" width="15" height="15" rx="3" opacity="0.7"/>
    <rect x="80" y="100" width="15" height="15" rx="3"/>
    <rect x="100" y="100" width="15" height="15" rx="3" opacity="0.7"/>
    <rect x="60" y="120" width="15" height="15" rx="3" opacity="0.5"/>
    <rect x="80" y="120" width="15" height="15" rx="3" opacity="0.7"/>
    <rect x="100" y="120" width="15" height="15" rx="3"/>
  </g>
  <!-- 底部接口 -->
  <rect x="70" y="145" width="60" height="5" fill="#1d4ed8" rx="2"/>
</svg>